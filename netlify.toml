# Configuração de deploy do Netlify

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Faz o Astro servir o site na raiz do domínio (base = "/")
  DEPLOY_TARGET = "netlify"
  NODE_VERSION = "22"

# Headers de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Força HTTPS em todas as visitas futuras (1 ano, incluindo subdomínios)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Restringe de onde o navegador pode carregar scripts/estilos/imagens.
    # Libera o que o site usa: Google Fonts, CDN do Sanity, imagens do Google,
    # o embed de posts do Instagram e o Google Analytics (pronto para quando
    # o ID for ativado em src/config.ts — ver gaMeasurementId).
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.instagram.com https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://*.analytics.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cdn.sanity.io https://lh3.googleusercontent.com https://*.cdninstagram.com https://*.fbcdn.net; frame-src https://www.instagram.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
